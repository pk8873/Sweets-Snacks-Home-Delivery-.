services:
  - type: web
    name: sweets-snacks-home-delivery
    env: python
    plan: free

    buildCommand: >-
      pip install -r requirements.txt &&
      npm --prefix whatsapp_bot install --omit=dev

    startCommand: bash start_render.sh

    envVars:
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: "https://sweets-snacks-home-delivery.onrender.com/telegram/webhook/"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false

      # Cloudinary Free - preferred single variable:
      # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: CLOUDINARY_URL
        sync: false
      # Optional alternative to CLOUDINARY_URL:
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: WHATSAPP_BOT_SECRET
        sync: false
      - key: WHATSAPP_DATABASE_URL
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: WHATSAPP_PORT
        value: "3000"
      - key: WHATSAPP_AUTH_DIR
        value: "./auth_info"
      - key: PAYMENT_KEY_ID
        sync: false
      - key: PAYMENT_KEY_SECRET
        sync: false
