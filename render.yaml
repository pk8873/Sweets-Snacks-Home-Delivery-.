services:
  - type: web
    name: sweets-snacks-home-delivery
    env: python
    plan: 0.5c-512mb

    disk:
      name: django-media
      mountPath: /var/data
      sizeGB: 1

    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate &&
      python manage.py check &&
      python create_admin.py &&
      python set_telegram_webhook.py

    startCommand: >-
      gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:$PORT

    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: "https://sweets-snacks-home-delivery.onrender.com/telegram/webhook/"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: MEDIA_ROOT
        value: "/var/data/media"
      - key: WHATSAPP_BOT_SECRET
        sync: false
      - key: WHATSAPP_BOT_URL
        value: "https://sweets-snacks-whatsapp-bot.onrender.com"
      - key: PAYMENT_KEY_ID
        sync: false
      - key: PAYMENT_KEY_SECRET
        sync: false

  - type: web
    name: sweets-snacks-whatsapp-bot
    env: node
    plan: 0.5c-512mb
    rootDir: whatsapp_bot

    disk:
      name: whatsapp-auth
      mountPath: /var/data
      sizeGB: 1

    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DJANGO_API_URL
        value: "https://sweets-snacks-home-delivery.onrender.com/whatsapp/api"
      - key: WHATSAPP_BOT_SECRET
        sync: false
      - key: WHATSAPP_AUTH_DIR
        value: "/var/data/auth_info"