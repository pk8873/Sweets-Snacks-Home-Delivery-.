services:
  - type: web
    name: sweet-snacks-bot
    runtime: python

    buildCommand: ./build.sh

    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    healthCheckPath: /admin/login/

    envVars:
      - key: PYTHON_VERSION
        value: 3.14.5

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: sweet-snacks-db
          property: connectionString

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: PAYMENT_KEY_ID
        sync: false

      - key: PAYMENT_KEY_SECRET
        sync: false


databases:
  - name: sweet-snacks-db
    databaseName: sweet_snacks
    user: sweet_snacks_user